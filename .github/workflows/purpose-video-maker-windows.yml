name: Purpose video maker Windows package

on:
  push:
    branches: ['purpose-video-maker/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: purpose-video-maker-windows
          cache-on-failure: true
          cache-workspace-crates: true
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: ./packaging/purpose-video-maker/package.ps1
      - name: Smoke test bundled media tools and installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = 'dist/purpose-video-maker'
          $stage = Join-Path $dist 'Purpose-video-maker-0.1.8-windows-x64'
          & (Join-Path $stage 'codex/codex.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Codex failed' }
          $ffmpeg = Join-Path $stage 'ffmpeg/bin/ffmpeg.exe'
          $ffprobe = Join-Path $stage 'ffmpeg/bin/ffprobe.exe'
          $sample = Join-Path $env:RUNNER_TEMP 'purpose-sample.mp4'
          & $ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=blue:s=1280x720:r=30 -t 1 -c:v libopenh264 -b:v 5M -pix_fmt yuv420p -y $sample
          if ($LASTEXITCODE -ne 0) { throw 'Bundled H.264 encoder failed' }
          $codec = (& $ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 $sample).Trim()
          if ($codec -ne 'h264') { throw "Unexpected codec: $codec" }
          $setup = Join-Path $dist 'Purpose-video-maker-0.1.8-windows-x64-setup.exe'
          $installed = Join-Path $env:RUNNER_TEMP 'purpose-installed'
          $process = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installed") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          & (Join-Path $installed 'purpose-video-maker.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed application failed' }
          if (-not (Test-Path -LiteralPath (Join-Path $installed 'ffmpeg/bin/ffmpeg.exe'))) { throw 'Installed FFmpeg missing' }
          if (-not (Test-Path -LiteralPath (Join-Path $installed 'licenses/filmcraft/NOTICE'))) { throw 'FilmCraft notice missing' }
          if (-not (Test-Path -LiteralPath (Join-Path $installed 'licenses/lucide/LICENSE.txt'))) { throw 'Lucide notice missing' }
          ./packaging/purpose-video-maker/smoke-gui.ps1 -Executable (Join-Path $installed 'purpose-video-maker.exe') -ProjectDirectory (Join-Path $env:RUNNER_TEMP 'purpose-gui-smoke')
      - name: Publish installer on GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $versionLine = Select-String -LiteralPath 'packaging/purpose-video-maker/installer.iss' -Pattern '^AppVersion=(.+)$'
          $version = $versionLine.Matches[0].Groups[1].Value
          $tag = "purpose-video-maker-v$version"
          $setup = Join-Path 'dist/purpose-video-maker' "Purpose-video-maker-$version-windows-x64-setup.exe"
          $sha256 = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $notes = Join-Path $env:RUNNER_TEMP 'purpose-installer-release.md'
          @"
          Windows x64 설치 파일입니다. 아래 setup.exe를 다운로드해 실행하세요.
          FFmpeg와 Codex CLI가 포함되어 있습니다.
          사이드바·창 버튼·서식·Codex·디자인·편집 아이콘을 Lucide로 통일하고 호버 시 선이 겹쳐 그려지는 문제를 수정했습니다.

          Commit: $env:GITHUB_SHA
          SHA-256: $sha256
          "@ | Set-Content -LiteralPath $notes -Encoding utf8
          gh release create $tag $setup --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Purpose video maker $version" --notes-file $notes --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Installer release failed; use a new package version for each release' }
          "Installer: https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/Purpose-video-maker-$version-windows-x64-setup.exe" >> $env:GITHUB_STEP_SUMMARY
